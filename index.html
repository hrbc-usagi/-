<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG立ち絵 ご依頼テンプレート作成ツール</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; line-height: 1.6; color: #333; background-color: #f7fafc; }
    h1 { font-size: 20px; color: #2c3e50; text-align: center; margin-bottom: 20px; }
    .intro-box { background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 8px; padding: 15px; font-size: 13px; color: #2b6cb0; margin-bottom: 25px; }
    .intro-box a { color: #2b6cb0; font-weight: bold; text-decoration: underline; }
    .intro-box a:hover { color: #2c5282; }
    
    .form-group { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .form-group label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #2d3748; }
    .sub-label { font-size: 12px; color: #718096; font-weight: normal; margin-bottom: 8px; display: block; }
    
    /* ※印の2行目以降の文頭を揃える指定 */
    .notice-text { font-size: 11px; color: #e53e3e; margin-top: 6px; line-height: 1.4; padding-left: 1em; text-indent: -1em; }
    .info-text { font-size: 11px; color: #718096; margin-bottom: 6px; line-height: 1.4; padding-left: 1em; text-indent: -1em; }
    
    input[type="text"], input[type="date"], textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 80px; resize: vertical; }
    
    /* プレースホルダー（記入例）の文字色を統一・薄く指定 */
    input::placeholder, textarea::placeholder {
      color: #a0aec0;
      opacity: 1; /* Firefox対策 */
    }

    /* インライン・ラジオ・チェックボックス */
    .radio-row { display: flex; gap: 15px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .radio-label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: normal !important; cursor: pointer; }
    .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: normal !important; cursor: pointer; }
    
    /* 表情差分用の横並び入力行 */
    .diff-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .diff-row .checkbox-label { min-width: 120px; }
    .diff-row input[type="text"] { flex: 1; min-width: 200px; }

    .input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .input-row input { flex: 1; }

    /* オプション項目の点線区切り */
    .opt-divider { border: none; border-top: 1px dashed #cbd5e0; margin: 12px 0; }

    /* 生成ボタン・出力 */
    .btn-generate { width: 100%; padding: 14px; background: #3182ce; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 20px 0; }
    .btn-generate:hover { background: #2b6cb0; }
    
    .output-section { background: #fff; border: 2px solid #cbd5e0; border-radius: 8px; padding: 20px; position: relative; margin-bottom: 40px; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .output-header h2 { font-size: 16px; margin: 0; color: #2d3748; }
    .btn-copy { padding: 8px 16px; background: #38a169; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .btn-copy:hover { background: #2f855a; }
    
    #resultText { width: 100%; height: 420px; font-family: monospace; font-size: 13px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; box-sizing: border-box; white-space: pre-wrap; }
  </style>
</head>
